[core]
shell=desktop-shell.so

[shell]
panel-position=none
background-image=/usr/share/backgrounds/qiyuan.png
background-color=0xff0b1220
clock-format=custom
clock-format-string=%m月%d日 %H:%M
panel-color=0xff0b1220

[launcher]
icon=/usr/share/icons/qiyuan-launcher.png
path=/usr/bin/qyappmenu

[output]
name=Virtual-1
mode=1280x800

# 启元全局快捷键（由 qynotifd evdev 守护执行；weston 本身忽略此段）
# 格式: 键名=命令    或    修饰键+键=命令
# 常见键名: KEY_LEFTMETA(Super) KEY_SYSRQ(PrtSc) KEY_VOLUMEUP/DOWN/MUTE
#           KEY_BRIGHTNESSUP/DOWN KEY_PLAYPAUSE KEY_NEXTSONG KEY_PREVIOUSSONG
[bindings]
KEY_LEFTMETA=qyappmenu
KEY_LEFTMETA+KEY_A=qyappmenu
KEY_LEFTMETA+KEY_S=qysearch
KEY_LEFTMETA+KEY_E=qyfiles
KEY_LEFTMETA+KEY_T=weston-terminal
KEY_LEFTMETA+KEY_I=qysettings
KEY_LEFTMETA+KEY_L=qylock
KEY_SYSRQ=qyshot
KEY_VOLUMEUP=amixer set Master 5%+
KEY_VOLUMEDOWN=amixer set Master 5%-
KEY_MUTE=amixer set Master toggle
KEY_BRIGHTNESSUP=brightnessctl set +10%
KEY_BRIGHTNESSDOWN=brightnessctl set 10%-